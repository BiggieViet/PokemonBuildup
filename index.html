<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mode Selector</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

  <!-- TOP SECTION -->
  <header class="top-section">
    <h1 id="pageTitle">Pokémon Buildup Mode</h1>

    <nav class="mode-nav">
      <button id="btnBuildup">Buildup</button>
      <button id="btnLockdown">Lockdown</button>
    </nav>
  </header>

  <!-- MAIN BODY -->
 <div class="app-body">

  <aside class="sidebar" id="sidebarContent"></aside>

  <main class="main-content" id="mainContent"></main>

  <div class="team-content" id="teamContent"></div>

</div>


  <!-- ALL PAGES LIVE HERE -->
  <div id="pages" style="display:none;">

    <!-- ============================
         BUILDUP PAGE
         ============================ -->
<div id="buildupPage">

  <div class="page-layout">
    
    <div class="page-main">
      <h2>Pokémon Buildup Page</h2>
      <button id="rollButton" class="roll-btn">Roll</button>
      <div id="rollSlots"></div>
    </div>

    <div class="page-sidebar">
      <div class="sidebar-section">
        <h3>Roll Settings</h3>
        <label for="rollCount">Roll #</label>
        <input id="rollCount" type="number" min="1" max="100" value="3">
      </div>

      <br>

      <div class="sidebar-section">
        <h3>Type Filter</h3>

        <label class="checkbox-row">
          <input type="checkbox" id="enableTypeFilter">
          Enable Type Filter
        </label>

        <div id="exactMatchBox" class="hidden">
          <label class="checkbox-row">
            <input type="checkbox" id="exactMatch">
            Exact Dual Match
          </label>
        </div>
        
        <!-- Monotype Only -->
        <div id="monoOnlyBox" class="sidebar-section hidden">
          <label>
            <input type="checkbox" id="monoOnly">
            Monotypes Match
          </label>
        </div>

        <div id="typeButtons" class="hidden type-grid">
          <button data-type="Normal">Normal</button>
          <button data-type="Fire">Fire</button>
          <button data-type="Water">Water</button>
          <button data-type="Grass">Grass</button>
          <button data-type="Electric">Electric</button>
          <button data-type="Ice">Ice</button>
          <button data-type="Fighting">Fighting</button>
          <button data-type="Poison">Poison</button>
          <button data-type="Ground">Ground</button>
          <button data-type="Flying">Flying</button>
          <button data-type="Psychic">Psychic</button>
          <button data-type="Bug">Bug</button>
          <button data-type="Rock">Rock</button>
          <button data-type="Ghost">Ghost</button>
          <button data-type="Dragon">Dragon</button>
          <button data-type="Dark">Dark</button>
          <button data-type="Steel">Steel</button>
          <button data-type="Fairy">Fairy</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Total Stats Filter</h3>
        <label>Min:</label>
        <input id="minBST" type="range" min="0" max="800" value="0">
        <span id="minBSTValue">0</span>

        <label>Max:</label>
        <input id="maxBST" type="range" min="0" max="800" value="800">
        <span id="maxBSTValue">800</span>
      </div>

      <div class="sidebar-section">
        <h3>Stage Filter</h3>

        <label class="checkbox-row">
          <input type="checkbox" id="stage1"> First Stage
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="stage2"> Second Stage
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="stage3"> Third Stage
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="singleStage"> Single Stage
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="fullyEvolved"> Fully Evolved
        </label>
      </div>

      <button id="resetFilters" class="reset-btn">Reset Filters</button>
      <button id="restartBuildup">Restart Buildup</button>

    </div>
    <div id="teamSection">
  <div class="page-team">
      <div id="teamPanel">
        <h3>Your Team</h3>
        <div id="teamGrid">
          <div class="team-slot"></div>
          <div class="team-slot"></div>
          <div class="team-slot"></div>
          <div class="team-slot"></div>
          <div class="team-slot"></div>
          <div class="team-slot"></div>
        </div>
      </div>
    </div>
</div>

    

  </div>

</div>


    <!-- ============================
         LOCKDOWN PAGE
         ============================ -->
    <div id="lockdownPage">

  <div class="page-main">

    <!-- HIDDEN UNTIL START -->
    <div id="lockdownDraftArea" class="hidden">

      <div id="lockdownTurnHeader">
        <h2 id="activePlayerName">Player 1</h2>
        <div id="activePlayerColor"></div>
      </div>

      <div id="lockdownTypeGrid" class="type-grid">
        <button class="type-icon" data-type="Normal"></button>
<button class="type-icon" data-type="Fire"></button>
<button class="type-icon" data-type="Water"></button>
<button class="type-icon" data-type="Grass"></button>
<button class="type-icon" data-type="Electric"></button>
<button class="type-icon" data-type="Ice"></button>
<button class="type-icon" data-type="Fighting"></button>
<button class="type-icon" data-type="Poison"></button>
<button class="type-icon" data-type="Ground"></button>
<button class="type-icon" data-type="Flying"></button>
<button class="type-icon" data-type="Psychic"></button>
<button class="type-icon" data-type="Bug"></button>
<button class="type-icon" data-type="Rock"></button>
<button class="type-icon" data-type="Ghost"></button>
<button class="type-icon" data-type="Dragon"></button>
<button class="type-icon" data-type="Dark"></button>
<button class="type-icon" data-type="Steel"></button>
<button class="type-icon" data-type="Fairy"></button>

      </div>

      <div class="lockdown-bins" id="lockdownBins"></div>

    </div>

  </div>

  <div class="page-sidebar lockdown-sidebar">

  <h3>Lockdown Settings</h3>

  <!-- Number of Players -->
  <div class="sidebar-section">
    <label>Number of Players</label>
    <input id="lockPlayers" type="number" min="1" max="8" value="2">
  </div>

  <!-- Number of Types Per Player -->
  <div class="sidebar-section">
    <label>Total Types Per Player</label>
    <input id="lockTypesPerPlayer" type="number" min="1" max="18" value="3">
  </div>

  <!-- Selection Order -->
  <div class="sidebar-section">
    <label>Selection Order</label>
    <select id="lockOrder">
      <option value="inorder">In Order (1 → 2 → 3 → 1)</option>
      <option value="snake">Snake (1 → 2 → 3 → 3 → 2 → 1)</option>
      <option value="randomRound">Random Within Round</option>
      <option value="randomFull">Random Throughout</option>
    </select>
  </div>

  <!-- Types Per Turn -->


  <button id="startLockdown" class="start-btn">Start</button>

</div>


</div>




</div>


    </div>

  </div>
  <script src="scripts/pokemon-clean.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
